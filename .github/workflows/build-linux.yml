name: Verify Linux packaging (PR 10598)
run-name: Linux packages ${{ inputs.subject_sha || 'b0a6e0937f0ff722a1bf02745e637e814ab7d8e2' }}

on:
  workflow_dispatch:
    inputs:
      subject_sha:
        description: Exact 40-character commit in aleksandr-miheichev/v2rayN
        required: true
        default: b0a6e0937f0ff722a1bf02745e637e814ab7d8e2
        type: string
      include_current_sdk:
        description: Also verify current stable SDK 11.0.100 using the script's environment override
        required: true
        default: true
        type: boolean
      rpm_runtime:
        description: RPM install/runtime distro; the UBI10 build image remains unchanged
        required: true
        default: almalinux-10.2
        type: choice
        options:
          - almalinux-10.2
          - ubi10
      package_format:
        description: Package formats to verify
        required: true
        default: all
        type: choice
        options:
          - all
          - deb
          - rpm
  push:
    branches:
      - codex/verify-pr10598-linux-packaging-20261114

permissions:
  contents: read

jobs:
  packages:
    name: ${{ matrix.format }} x64 / ${{ matrix.sdk }}
    runs-on: ubuntu-26.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        format: ${{ fromJSON(inputs.package_format == 'deb' && '["deb"]' || inputs.package_format == 'rpm' && '["rpm"]' || '["deb","rpm"]') }}
        sdk: ${{ fromJSON((github.event_name == 'push' || inputs.include_current_sdk) && '["script-default","11.0.100"]' || '["script-default"]') }}
    env:
      SUBJECT_SHA: ${{ inputs.subject_sha || 'b0a6e0937f0ff722a1bf02745e637e814ab7d8e2' }}
      PACKAGE_FORMAT: ${{ matrix.format }}
      SDK_MODE: ${{ matrix.sdk }}
      RPM_RUNTIME: ${{ inputs.rpm_runtime || 'almalinux-10.2' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout validation helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aleksandr-miheichev/v2rayN
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false

      - name: Validate exact source identity
        run: |
          set -euo pipefail
          [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p evidence/packages evidence/runtime display-socket
          printf 'subject_sha=%s\nvalidation_sha=%s\nformat=%s\nsdk_mode=%s\nrunner_os=%s\n' \
            "$SUBJECT_SHA" "$GITHUB_SHA" "$PACKAGE_FORMAT" "$SDK_MODE" "$RUNNER_OS" > evidence/identity.txt
          printf 'Not run: build has not completed.\n' > evidence/build-status.txt
          printf 'Not run: package installation has not completed.\n' > evidence/install-status.txt
          printf 'Not run: full UI smoke has not completed.\n' > evidence/runtime-status.txt
          uname -a > evidence/host-kernel.txt
          docker version > evidence/docker-version.txt
          printf 'TASK_PREFIX=pr10598-%s-%s-%s\n' "$GITHUB_RUN_ID" "$PACKAGE_FORMAT" "$SDK_MODE" >> "$GITHUB_ENV"

      - name: Checkout immutable subject source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aleksandr-miheichev/v2rayN
          ref: ${{ env.SUBJECT_SHA }}
          path: subject
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Resolve disposable container images
        run: |
          set -euo pipefail
          exec > >(tee evidence/image-resolution.log) 2>&1
          test "$(git -C subject rev-parse HEAD)" = "$SUBJECT_SHA"
          git -C subject submodule status --recursive > evidence/submodules.txt
          git -C subject status --porcelain > evidence/source-status-before.txt
          git -C subject describe --tags --always > evidence/source-describe.txt
          sha256sum subject/package-{debian,rhel}.sh > evidence/script-source.sha256
          docker pull debian:13
          docker image inspect debian:13 > evidence/debian-image.json
          printf 'DISPLAY_BASE=%s\n' "$(docker image inspect --format '{{.Id}}' debian:13)" >> "$GITHUB_ENV"
          if [[ "$PACKAGE_FORMAT" == deb ]]; then
            image=debian:13
          else
            image=registry.access.redhat.com/ubi10/ubi
            docker pull "$image"
          fi
          docker image inspect "$image" > evidence/build-image.json
          printf 'BUILD_IMAGE=%s\n' "$(docker image inspect --format '{{.Id}}' "$image")" >> "$GITHUB_ENV"
          install_image="$image"
          install_target=debian-13
          if [[ "$PACKAGE_FORMAT" == rpm ]]; then
            case "$RPM_RUNTIME" in
              ubi10) install_target=ubi10 ;;
              almalinux-10.2)
                # Official stable 10.2-20261027 linux/amd64 manifest, verified 2026-11-14.
                install_image=docker.io/library/almalinux@sha256:be4feaca99462d71397c21275f3a8a000e5175aaa94bb9fb52adc4494662a442
                install_target=almalinux-10.2
                docker pull --platform linux/amd64 "$install_image"
                ;;
              *) printf 'Unsupported RPM runtime selection: %s\n' "$RPM_RUNTIME" >&2; exit 1 ;;
            esac
          fi
          docker image inspect "$install_image" > evidence/install-base-image.json
          printf 'INSTALL_IMAGE=%s\nINSTALL_TARGET=%s\n' \
            "$(docker image inspect --format '{{.Id}}' "$install_image")" "$install_target" >> "$GITHUB_ENV"
          printf 'build_image=%s\ninstall_target=%s\ninstall_image=%s\n' \
            "$image" "$install_target" "$install_image" > evidence/image-selection.txt

      - name: Run the full production packaging CLI
        id: build
        run: |
          set -euo pipefail
          set +e
          docker run --name "$TASK_PREFIX-build" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/subject,dst=/source" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/validation/.github/scripts,dst=/ci,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/evidence,dst=/evidence" \
            --env SUBJECT_SHA --env PACKAGE_FORMAT --env SDK_MODE \
            "$BUILD_IMAGE" bash /ci/packaging-ci.sh build 2>&1 | tee evidence/build-container.log
          result=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$result" >> evidence/build-status.txt
          exit "$result"

      - name: Install the real package in a fresh disposable container
        id: install
        run: |
          set -euo pipefail
          set +e
          docker run --name "$TASK_PREFIX-install" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/validation/.github/scripts,dst=/ci,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/evidence,dst=/evidence" \
            --env SUBJECT_SHA --env PACKAGE_FORMAT --env SDK_MODE --env INSTALL_TARGET \
            "$INSTALL_IMAGE" bash /ci/packaging-ci.sh install 2>&1 | tee evidence/install-container.log
          result=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$result" >> evidence/install-status.txt
          test "$result" -eq 0
          docker commit "$TASK_PREFIX-install" "$TASK_PREFIX-runtime" > evidence/runtime-image-id.txt

      - name: Prepare isolated Xvfb display container
        run: |
          set -euo pipefail
          set +e
          docker run --name "$TASK_PREFIX-display-prepare" "$DISPLAY_BASE" bash -c \
            'set -euo pipefail; export DEBIAN_FRONTEND=noninteractive; apt-get update; apt-get install --no-install-recommends -y xvfb; dpkg-query -W' \
            2>&1 | tee evidence/display-install.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 0
          docker commit "$TASK_PREFIX-display-prepare" "$TASK_PREFIX-display-image" > evidence/display-image-id.txt
          docker run --detach --name "$TASK_PREFIX-display" --network none \
            --mount "type=bind,src=$GITHUB_WORKSPACE/display-socket,dst=/tmp/.X11-unix" \
            "$TASK_PREFIX-display-image" Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp -ac \
            > evidence/display-container-id.txt
          for _ in {1..50}; do
            [[ -S display-socket/X99 ]] && exit 0
            sleep 0.2
          done
          docker logs "$TASK_PREFIX-display"
          exit 1

      - name: Run installed apphost without network under Xvfb
        id: runtime
        timeout-minutes: 5
        run: |
          set -euo pipefail
          set +e
          docker run --name "$TASK_PREFIX-smoke" --user 10001:10001 --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE/validation/.github/scripts,dst=/ci,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/evidence,dst=/evidence" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/display-socket,dst=/tmp/.X11-unix,readonly" \
            --env DISPLAY=:99 --env SUBJECT_SHA --env PACKAGE_FORMAT --env SDK_MODE \
            "$TASK_PREFIX-runtime" python3 -B /ci/packaging-smoke.py 2>&1 | tee evidence/smoke-container.log
          result=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$result" >> evidence/runtime-status.txt
          exit "$result"

      - name: Record stage results and collect container logs
        if: ${{ always() }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'subject_sha=%s\nvalidation_sha=%s\nformat=%s\nsdk_mode=%s\nbuild=%s\ninstall=%s\nruntime=%s\ninstall_target=%s\ninstall_image=%s\n' \
            "$SUBJECT_SHA" "$GITHUB_SHA" "$PACKAGE_FORMAT" "$SDK_MODE" \
            "$BUILD_OUTCOME" "$INSTALL_OUTCOME" "$RUNTIME_OUTCOME" \
            "${INSTALL_TARGET:-unresolved}" "${INSTALL_IMAGE:-unresolved}" > evidence/stage-results.txt
          if [[ -n "${TASK_PREFIX:-}" ]]; then
            for stage in build install display-prepare display smoke; do
              docker logs "$TASK_PREFIX-$stage" > "evidence/docker-$stage.log" 2>&1 || true
              docker inspect "$TASK_PREFIX-$stage" > "evidence/docker-$stage.json" 2>&1 || true
            done
          fi
          {
            printf 'Subject %s; validation %s; %s x64; SDK %s.\n\n' "$SUBJECT_SHA" "$GITHUB_SHA" "$PACKAGE_FORMAT" "$SDK_MODE"
            printf 'Build: **%s**; installation: **%s**; installed apphost/Xvfb: **%s**.\n\n' "$BUILD_OUTCOME" "$INSTALL_OUTCOME" "$RUNTIME_OUTCOME"
            printf 'Install/runtime environment: **%s**. RPM build remains UBI10; an AlmaLinux result is a separate target and does not replace prior UBI installation failure evidence.\n\n' "${INSTALL_TARGET:-unresolved}"
            printf 'The script-default job is the existing SDK 10.0.114 pipeline reference. SDK 11.0.100 is a separate environment override. See evidence for actual selected SDK/runtime versions.\n\n'
            printf 'Linux containers on a hosted VM with a Mesa software-rendering request; physical Linux and hardware GPU: Not run. Manual full-window screenshot review remains required.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs, installed payload manifests, screenshots and packages
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packaging-${{ env.SUBJECT_SHA }}-${{ matrix.format }}-${{ matrix.sdk }}-${{ env.INSTALL_TARGET || 'unresolved' }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Clean up task-owned disposable containers
        if: ${{ always() }}
        run: |
          if [[ -n "${TASK_PREFIX:-}" ]]; then
            for stage in build install display-prepare display smoke; do
              docker rm -f "$TASK_PREFIX-$stage" >/dev/null 2>&1 || true
            done
          fi
