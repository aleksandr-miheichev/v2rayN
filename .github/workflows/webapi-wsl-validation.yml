name: WebAPI Linux ARM64 validation

on:
  push:
    branches:
      - codex/validate-webapi-wsl-fixes

permissions:
  contents: read

env:
  SOURCE_REVISION: a01a91aeca3f8657795476733a733245580d4a1b
  TUNIT_MAX_PARALLEL_TESTS: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  V2RAYN_WEB_COMMIT: a01a91aeca3f8657795476733a733245580d4a1b
  V2RAYN_WEB_REPOSITORY: 2dust/v2rayN

jobs:
  verify:
    name: Full verification (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: Record source and runtime
        run: |
          git rev-parse HEAD
          uname -m
          dotnet --info
      - name: Full WebAPI verification
        run: bash v2rayN/v2rayN.WebAPI/Scripts/verify.sh "$RUNNER_TEMP/publish/linux-arm64"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-verification-linux-arm64
          path: TestResults
          retention-days: 14
