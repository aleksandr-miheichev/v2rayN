name: Subscription split integration

on:
  workflow_dispatch:
  push:
    branches:
      - codex/validate-subscription-split-20261103

permissions:
  contents: read

jobs:
  integration:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      V2RAYN_LOCAL_APPLICATION_DATA_V2: '0'
      TUNIT_MAX_PARALLEL_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'

      - name: Test ServiceLib
        run: dotnet test --project ./v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --artifacts-path ./artifacts/servicelib --results-directory ./TestResults/servicelib --no-ansi --no-progress --minimum-expected-tests 278 --report-trx

      - name: Test WebAPI
        if: ${{ !cancelled() }}
        run: dotnet test --project ./v2rayN/v2rayN.WebAPI/Tests/v2rayN.WebAPI.Tests.csproj -c Release --artifacts-path ./artifacts/webapi --results-directory ./TestResults/webapi --no-ansi --no-progress --minimum-expected-tests 402 --report-trx

      - name: Build Avalonia UI
        if: ${{ !cancelled() }}
        run: dotnet build ./v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release --artifacts-path ./artifacts/desktop

      - name: Build WPF UI
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: dotnet build ./v2rayN/v2rayN/v2rayN.csproj -c Release --artifacts-path ./artifacts/wpf

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: subscription-split-results-${{ matrix.os }}
          path: ./TestResults/**/*.trx
          if-no-files-found: error
